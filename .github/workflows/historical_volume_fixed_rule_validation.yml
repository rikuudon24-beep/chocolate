name: Historical Volume Fixed Rule Validation
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy requests
      - run: python src/historical_volume_fixed_rule_validation.py
      - run: cat results/historical_volume_fixed_rule_validation.csv
