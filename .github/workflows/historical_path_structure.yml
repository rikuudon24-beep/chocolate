name: Historical Path Structure
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy requests
      - run: python src/historical_path_structure.py
      - name: Print path structure results
        run: |
          echo "=== SUMMARY ==="
          cat results/historical_path_structure_summary.json
          echo "=== BINS ==="
          cat results/historical_path_structure_bins.csv
          echo "=== SEQUENCE ==="
          cat results/historical_sequence_structure.csv
          echo "=== DD SHUFFLE ==="
          cat results/historical_sequence_dd_shuffle.csv
