name: Historical Path Structure
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy requests
      - run: python src/historical_path_structure.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/historical_path_structure* results/historical_sequence_structure.csv results/historical_sequence_dd_shuffle.csv
          git diff --cached --quiet || git commit -m "Run historical path structure audit"
          git push
