name: Volume State Permutation Audit
on:
  push:
    paths:
      - "src/volume_state_permutation.py"
      - ".github/workflows/volume_state_permutation.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas requests numpy
      - run: python -u src/volume_state_permutation.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update volume state permutation audit"
          file_pattern: "results/volume_state_permutation.csv results/volume_state_permutation_summary.json"
