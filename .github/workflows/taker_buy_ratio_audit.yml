name: Taker Buy Ratio Audit
on:
  push:
    paths:
      - "src/taker_buy_ratio_audit.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python src/taker_buy_ratio_audit.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/taker_buy_ratio_*
          git diff --cached --quiet || git commit -m "research: audit taker buy ratio"
          git push
