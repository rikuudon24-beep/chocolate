name: Technical Indicator Walkforward
on:
  push:
    paths:
      - "src/technical_indicator_walkforward.py"
      - ".github/workflows/technical_indicator_walkforward.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - run: python src/technical_indicator_walkforward.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update technical indicator walkforward"
          file_pattern: "results/technical_indicator_walkforward.csv results/technical_indicator_walkforward_summary.json"
