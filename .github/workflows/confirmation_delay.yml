name: Confirmation delay research
on:
  push:
    branches: [main]
    paths:
      - "src/confirmation_delay_walkforward.py"
      - "src/audit_oos.py"
      - ".github/workflows/confirmation_delay.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m pip install --disable-pip-version-check pandas numpy requests
          python src/confirmation_delay_walkforward.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/confirmation_delay_*.csv results/confirmation_delay_audit.json
          git diff --cached --quiet || git commit -m "research: audit confirmation delay"
          git push
