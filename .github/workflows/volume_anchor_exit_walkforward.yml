name: Volume Anchor Exit Walkforward
on:
  push:
    branches: [main]
    paths:
      - "src/volume_anchor_exit_walkforward.py"
      - ".github/workflows/volume_anchor_exit_walkforward.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - run: python src/volume_anchor_exit_walkforward.py
      - name: Save results
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update volume anchor exit walkforward"
          add: "results/volume_anchor_exit_walkforward.*"
