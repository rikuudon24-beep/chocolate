name: BB Reentry Depth Research

on:
  push:
    paths:
      - "src/bb_reentry_depth_walkforward.py"
      - "src/audit_oos.py"
      - ".github/workflows/bb_reentry_depth.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas requests
      - run: python src/bb_reentry_depth_walkforward.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/bb_reentry_depth_*.csv results/bb_reentry_depth_audit.json
          git diff --cached --quiet || git commit -m "research: add BB reentry depth results"
          git push
