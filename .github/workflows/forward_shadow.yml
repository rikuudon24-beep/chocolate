name: Forward Shadow

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Run shortly after each UTC 4H candle close.
    - cron: "17 0,4,8,12,16,20 * * *"

permissions:
  contents: write

concurrency:
  group: forward-shadow-main
  cancel-in-progress: false

jobs:
  forward-shadow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run forward shadow
        run: python src/forward_shadow.py

      - name: Save forward shadow results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/forward_shadow_events.csv results/forward_shadow_returns.csv results/forward_shadow_volume_events.csv results/forward_shadow_volume_returns.csv results/forward_shadow_fixed_rule_events.csv results/forward_shadow_fixed_rule_returns.csv
          git diff --cached --quiet || git commit -m "Update forward shadow results"
          git pull --rebase origin main
          git push
