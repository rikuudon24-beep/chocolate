name: Historical Volume Path Timing
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy requests
      - run: python src/historical_volume_path_timing.py
      - name: Print timing results
        run: |
          echo "=== SUMMARY ==="
          cat results/historical_volume_path_timing_summary.json
          echo "=== TIMING SUMMARY ==="
          cat results/historical_volume_path_timing_summary.csv
          echo "=== ADVERSE BINS ==="
          cat results/historical_volume_path_adverse_bins.csv
          echo "=== ARCHETYPES ==="
          cat results/historical_volume_path_archetypes.csv
          echo "=== ARCHETYPES BY YEAR ==="
          cat results/historical_volume_path_archetypes_by_year.csv
