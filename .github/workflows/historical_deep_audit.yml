name: Historical Deep Audit
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests
      - run: python src/historical_deep_audit.py
      - name: Print deep audit results
        run: |
          echo "=== SUMMARY ==="
          cat results/historical_deep_audit_summary.json
          echo "=== BOOTSTRAP ==="
          cat results/historical_deep_bootstrap.csv
          echo "=== TARGET STOP SURFACE ==="
          cat results/historical_deep_target_stop_surface.csv
          echo "=== YEAR STABILITY ==="
          cat results/historical_deep_year_stability.csv
          echo "=== CLUSTER ==="
          cat results/historical_deep_cluster.json
