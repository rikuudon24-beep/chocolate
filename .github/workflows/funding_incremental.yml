name: Funding Incremental
on:
  push:
    paths:
      - "src/funding_incremental.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas
      - run: python src/funding_incremental.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add results/funding_incremental_*
          git diff --cached --quiet || (git commit -m "research: funding incremental audit" && git push)
