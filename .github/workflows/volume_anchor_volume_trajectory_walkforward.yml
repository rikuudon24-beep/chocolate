name: Volume Anchor Volume Trajectory Walkforward
on:
  push:
    branches: [main]
    paths:
      - "src/volume_anchor_volume_trajectory_walkforward.py"
      - ".github/workflows/volume_anchor_volume_trajectory_walkforward.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - run: python src/volume_anchor_volume_trajectory_walkforward.py
