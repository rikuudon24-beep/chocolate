name: RSI recovery speed research
on:
  push:
    branches: [main]
    paths:
      - "src/rsi_recovery_speed_walkforward.py"
      - "src/audit_oos.py"
      - ".github/workflows/rsi_recovery_speed.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run RSI recovery speed audit
        run: |
          python -m pip install --disable-pip-version-check pandas numpy requests
          python src/rsi_recovery_speed_walkforward.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/rsi_recovery_speed_*.csv results/rsi_recovery_speed_audit.json
          git diff --cached --quiet || git commit -m "research: audit RSI recovery speed"
          git push
