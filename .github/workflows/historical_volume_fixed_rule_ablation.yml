name: Historical Fixed Rule Ablation

on:
  push:
    branches: [main]
    paths:
      - "src/historical_volume_fixed_rule_ablation.py"
      - ".github/workflows/historical_volume_fixed_rule_ablation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python src/historical_volume_fixed_rule_ablation.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/historical_volume_fixed_rule_ablation.csv results/historical_volume_fixed_rule_ablation_events.csv
          git diff --cached --quiet || git commit -m "Update fixed rule ablation audit"
          git pull --rebase origin main
          git push
