name: Research Audit

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: write

concurrency:
  group: research-audit-main
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run audit
        run: python src/audit_oos.py

      - name: Run exit research
        run: python src/exit_research.py

      - name: Run robustness research
        run: python src/robustness.py
      - name: Run 1D regime research
        run: python src/regime_oos.py

      - name: Run structural failure research
        run: python src/structural_failure_oos.py

      - name: Run walk-forward validation
        run: python src/walkforward_oos.py

      - name: Run walk-forward uncertainty analysis
        run: python src/walkforward_bootstrap.py

      - name: Run untouched forward shadow validation
        run: python src/forward_shadow.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "Update research audit results"
          git push
