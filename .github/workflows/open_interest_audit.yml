name: Open Interest Audit
on:
  workflow_dispatch:
  push:
    paths:
      - "src/open_interest_audit.py"
      - ".github/workflows/open_interest_audit.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy
      - run: python src/open_interest_audit.py
      - name: Show results
        run: |
          echo 'Open-interest audit completed'
          cat results/open_interest_summary.csv
