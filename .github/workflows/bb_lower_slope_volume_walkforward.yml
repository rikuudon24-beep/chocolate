name: BB Lower Slope Volume Walkforward
on:
  push:
    paths:
      - "src/bb_lower_slope_volume_walkforward.py"
      - "results/bb_lower_slope_volume_overlap_events.csv"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy
      - run: python src/bb_lower_slope_volume_walkforward.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/bb_lower_slope_volume_walkforward.csv
          git diff --cached --quiet || git commit -m "research: validate BB slope volume interaction"
          git push
