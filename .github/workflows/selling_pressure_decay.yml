name: Selling pressure decay research
on:
  push:
    branches: [main]
    paths:
      - "src/selling_pressure_decay_walkforward.py"
      - "src/audit_oos.py"
      - ".github/workflows/selling_pressure_decay.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pressure decay audit
        run: |
          python -m pip install --disable-pip-version-check pandas numpy requests
          python src/selling_pressure_decay_walkforward.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/selling_pressure_decay_*.csv results/selling_pressure_decay_audit.json
          git diff --cached --quiet || git commit -m "research: audit selling pressure decay"
          git push
