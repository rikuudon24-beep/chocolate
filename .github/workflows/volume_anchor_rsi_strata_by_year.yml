name: Volume Anchor RSI Strata By Year
on:
  workflow_dispatch:
  push:
    paths:
      - "src/volume_anchor_rsi_strata_by_year.py"
      - "results/condition_search_events.csv"
      - ".github/workflows/volume_anchor_rsi_strata_by_year.yml"
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - run: python src/volume_anchor_rsi_strata_by_year.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update yearly RSI strata audit"
          file_pattern: "results/volume_anchor_rsi_strata_by_year.json"